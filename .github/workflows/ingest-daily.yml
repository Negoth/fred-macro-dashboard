# 12 market-data series. Fetched after the US market close on business days
name: ingest-daily

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

# The permissions a called workflow requests cannot exceed those of the caller.
# The repository default is read, so without this declaration the run is rejected at start
permissions:
  contents: write

jobs:
  call:
    uses: ./.github/workflows/ingest.yml
    with:
      cadence: daily
    secrets:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
