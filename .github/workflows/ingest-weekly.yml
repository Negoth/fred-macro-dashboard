# 7 series: ICSA (published Thursdays), NFCI, and the Fed balance sheet series
name: ingest-weekly

on:
  schedule:
    - cron: "0 13 * * 4"
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch the full history (one-off backfill)"
        required: false
        default: false
        type: boolean

# The permissions a called workflow requests cannot exceed those of the caller.
# The repository default is read, so without this declaration the run is rejected at start
permissions:
  contents: write

jobs:
  call:
    uses: ./.github/workflows/ingest.yml
    with:
      cadence: weekly
      # false on a schedule, since github.event.inputs is null there
      full: ${{ github.event.inputs.full == 'true' }}
    secrets:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
