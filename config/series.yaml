# Target series definitions
#
# Source of truth: docs/fred-tableau-architecture.md, chapter 6 "The dashboard's question".
# This file is the implementation of that chapter; ingest / staging / marts take it as their
# single input.
#
# The pillar scores and the two quadrant maps were retired when the dashboard was refurbished
# around the monetary policy cycle and the credit cycle, so the fields that drove them
# (`transform`, `sign`, `season_axis`, `season_role`, and the `pillars:` and `seasons:` blocks)
# are gone. `pillar` remains as a plain grouping category on dim_series.
#
# Every `rationale:` is kept: it records why each series is collected, which outlives whatever
# the series is currently wired into.
#
# WARNING: always run the liveness-check script in 6.8 before implementing.
#    FRED discontinues and replaces series (TWEXBGSMTH was suspected; the ISM series were removed).
#    Series marked `verify: true` need particular attention.

meta:
  scope: "US + JPY"           # 6.1 / no international comparison
  # Decided from the measurements taken on 2026-08-18 (see `verification` at the end of this file).
  # 1990 turned out to be unattainable: the TIPS/BEI series (T10YIE, T5YIFR, DFII10) all start
  # in 2003-01. Display filter only -- it never limits what is ingested or computed.
  history_start: "2003-01-01"
  strategy: A                 # 3.2 trailing window
  lookback_months: 24

series:
  # ── Growth ────────────────────────────────────────────────────────────────────
  - id: PAYEMS
    title_display: Nonfarm payroll employment
    pillar: growth
    freq: M
    ingest: monthly
    rationale: Employment is the core coincident indicator. With YoY, turning points are detected six months late

  - id: ICSA
    title_display: Initial jobless claims
    pillar: growth
    freq: W
    ingest: weekly
    rationale: One of the few real-activity indicators available weekly. A rise means slowing growth, so the axis direction is inverted

  - id: INDPRO
    title_display: Industrial production index
    pillar: growth
    freq: M
    ingest: monthly
    rationale: Representative of the manufacturing cycle. Its cyclical amplitude is large, so the z-score is informative

  - id: PERMIT
    title_display: Housing building permits
    pillar: growth
    freq: M
    ingest: monthly
    rationale: Highly rate-sensitive and strongly leading. Lets you read the lag against the financial-conditions pillar

  - id: UMCSENT
    title_display: University of Michigan consumer sentiment index
    pillar: growth
    freq: M
    ingest: monthly
    rationale: Soft data. It leads the hard data but can also diverge from it, so we keep both

  - id: AWHMAN
    title_display: Average weekly hours, manufacturing (production & nonsupervisory)
    pillar: growth
    freq: M
    ingest: monthly
    rationale: |
      Overtime hours move before headcount does, so this leads PAYEMS. A classic LEI component.
      USSLIND was originally used as the leading component, but it stopped updating in 2020-02, so it was replaced.

  - id: NEWORDER
    title_display: Core capital goods orders (nondefense, excluding aircraft)
    pillar: growth
    freq: M
    ingest: monthly
    rationale: A leading indicator of capital expenditure. A demand signal on a different track from AWHMAN's labour input

  # ── Inflation ─────────────────────────────────────────────────────────────────
  - id: CPILFESL
    title_display: Core CPI (excluding food & energy)
    pillar: inflation
    freq: M
    ingest: monthly
    rationale: YoY lags at turning points because of base effects. The 3-month annualised rate is better suited to identifying the regime

  - id: PCEPILFE
    title_display: Core PCE price index
    pillar: inflation
    freq: M
    ingest: monthly
    rationale: The Fed's policy target itself. Needed to read the policy reaction function

  - id: T10YIE
    title_display: Expected inflation (10-year breakeven)
    pillar: inflation
    freq: D
    ingest: daily
    rationale: The inflation the market is pricing in. The "fast layer" that leads the real-activity indicators

  - id: T5YIFR
    title_display: 5-year, 5-year forward expected inflation rate
    pillar: inflation
    freq: D
    ingest: daily
    rationale: The level of the anchor, stripped of short-term fluctuation. Its divergence from T10YIE is informative

  - id: DCOILWTICO
    title_display: WTI crude oil price
    pillar: inflation
    freq: D
    ingest: daily
    rationale: The main driver of headline inflation. Watch its divergence from core

  - id: AHETPI
    title_display: Average hourly earnings (production & nonsupervisory)
    pillar: inflation
    freq: M
    ingest: monthly
    rationale: The wage side, which determines how sticky inflation is. A leading indicator of services inflation

  # ── Financial conditions & liquidity ──────────────────────────────────────────
  - id: NFCI
    title_display: Chicago Fed National Financial Conditions Index
    pillar: financial
    freq: W
    ingest: weekly
    rationale: An off-the-shelf composite bundling over 100 indicators. Also used to sanity-check our own scores

  - id: T10Y3M
    title_display: Yield curve (10-year minus 3-month)
    pillar: financial
    freq: D
    ingest: daily
    rationale: Held to predict recessions better than 10Y-2Y. Negative when the curve is inverted

  - id: T10YFF
    title_display: 10-year yield minus the fed funds rate
    pillar: financial
    freq: D
    ingest: daily
    origin: initial   # inherited from the initial 5-series proposal
    rationale: |
      Chapter 3 of the book: "the yield spread is a leading indicator of the economy". Treated not as an axis of
      the four seasons but as advance notice of a change of season.
      The position of long rates relative to the policy rate = how tight monetary policy is in relative terms

  - id: DGS10
    title_display: 10-year Treasury yield (long-term rate)
    pillar: financial
    freq: D
    ingest: daily
    origin: initial
    rationale: |
      The second of the book's "three interest rates". It was originally excluded on the grounds that it enters
      three times as a component of T10YFF / T10Y3M / DFII10 and would therefore be triple-counted, but that was
      only true of the *level*.
      The "direction of rates" axis of the four seasons can only be built from the change in long rates (both
      T10YFF and T10Y3M are levels of a spread, so the axis does not move when short and long rates rise together).
      Since we take only the change and not the level, no triple-counting occurs.

  - id: DFII10
    title_display: 10-year real rate (TIPS yield)
    pillar: financial
    freq: D
    ingest: daily
    rationale: It is the real rate, not the nominal rate, that discounts asset prices. A rise is a headwind for valuations

  - id: FEDFUNDS
    title_display: Fed funds rate (effective)
    pillar: financial
    freq: M
    ingest: monthly
    origin: initial
    rationale: Held as a change rather than a level. As per 6.2-B, 0.25->0.50 and 5.00->5.25 are not the same thing

  # ── Credit & risk appetite ────────────────────────────────────────────────────
  - id: BAA10Y
    title_display: Baa corporate bond minus 10-year Treasury spread
    pillar: credit
    freq: D
    ingest: daily
    origin: initial
    rationale: |
      The third of the book's "three interest rates" (the corporate bond yield), and the corporate spread of
      chapter 4 itself. Credit stress on the investment-grade side. The only one of the initial five series whose
      sign is determined on its own

  - id: VIXCLS
    title_display: VIX index
    pillar: credit
    freq: D
    ingest: daily
    rationale: The uncertainty priced in by the equity market. Divergence from credit spreads is a sign of stress

  - id: DRTSCILM
    title_display: Bank lending standards (SLOOS, large & medium firms)
    pillar: credit
    freq: Q
    ingest: monthly
    rationale: |
      Quarterly, but strongly leading. Market credit and bank credit are different things, so we hold both.
      This is the very axis the book's four seasons use to separate the seasons, as "bank lending standards"

  # ── Dollar & external ─────────────────────────────────────────────────────────
  - id: DTWEXBGS
    title_display: Trade-weighted dollar index (broad, goods & services)
    pillar: dollar
    freq: D
    ingest: daily
    rationale: |
      A stronger dollar raises the real burden of dollar-denominated debt worldwide and thus acts as global tightening.
      TWEXBGSMTH from the initial proposal has not been discontinued (it is still updating as of 2026-07); it is the
      monthly version of this same index. Both also start in 2006-01. The only reason for taking the daily version is
      that it matches the grain of the other market series.
      Note that chapter 5 of the book deals not with the dollar index but with the World Dollar (WORLD_DOLLAR):
      this one is "the price of the dollar", that one is "the quantity of dollars" — a different dimension. We hold both.

  - id: DEXJPUS
    title_display: USD/JPY exchange rate
    pillar: dollar
    freq: D
    ingest: daily
    rationale: |
      The perspective of an investor whose living expenses are in yen. A weaker yen raises the yen-converted return on
      foreign-currency assets, hence +1.
      Note that this sign depends on the investor's currency, and would mean something different for a US-based
      investor (this is stated explicitly in the README).

# Derived series: computed in the intermediate layer from several raw series
derived:
  - id: WORLD_DOLLAR
    title_display: World Dollar (US dollar liquidity)
    pillar: dollar
    freq: W
    ingest: weekly
    inputs: [BOGMBASE, WMTSECL1]
    formula: "BOGMBASE + WMTSECL1"
    rationale: |
      The US dollar liquidity measure covered by chapter 5 of the book, "Money goes around the world".
      It is the monetary base the Fed supplies domestically plus the Treasuries held as foreign-exchange reserves by
      non-US central banks and others (the Fed custody holdings). It measures the total quantity of dollars circulating
      in the world.
      The initial proposal used TWEXBGSMTH (the dollar index) as a proxy, but the dollar index is "the price of the
      dollar" and is a different thing from WD, "the quantity of dollars", so it was rebuilt on the original definition.
      BOGMBASE is monthly and WMTSECL1 is weekly, so it is forward-filled onto the weekly grid.
      The old WMTSECL was discontinued in 2012-11; we use its successor WMTSECL1.

  - id: NET_LIQUIDITY
    title_display: Fed net liquidity
    pillar: financial
    freq: W
    ingest: weekly
    inputs: [WALCL, RRPONTSYD, WTREGEN]
    formula: "WALCL - RRPONTSYD - WTREGEN"
    rationale: |
      From the Fed's balance sheet, subtract the part absorbed by reverse repos and the Treasury General Account that
      therefore does not circulate in the market.
      During QT the liquidity the market feels lags the shrinkage of total assets, so this difference carries meaning.
      All three series are weekly and share a publication date, so they can be combined.
context:
  - id: USREC
    title_display: NBER recession flag
    freq: M
    ingest: monthly
    usage: Shading on the historical charts (the is_recession of 3.6)

  - id: BAMLH0A0HYM2
    title_display: US high-yield bond OAS
    freq: D
    ingest: daily
    usage: |
      Shown only in the change table and the tooltips; not counted in the pillar scores.
      It is single-handedly the most informative measure of current credit stress, but licensing restrictions mean
      the ICE BofA series on FRED only go back about three years (from 2023-08-21) and cover neither 2008 nor 2020.
      Taking a z-score over that history would be meaningless, so it was excluded in favour of consistency in the
      time-series scores.
      BAMLC0A0CM (IG OAS) is under the same restriction. The long-history credit signal is carried by BAA10Y (from 1986).

  - id: SAHMREALTIME
    title_display: Sahm rule recession indicator
    freq: M
    ingest: monthly
    usage: |
      Breakdown flag T3 (>= 0.5). Carried forward up to 2 months to cover the publication lag.
      Fires 1-3 months after a recession starts, so it confirms rather than warns
      (false positive in 2024-07).

  # ── Regime inputs ─────────────────────────────────────────────────────────────
  # Added for the monetary policy cycle / credit cycle dashboard. Not dashboard series in
  # their own right; they are the raw material for int_regime_monthly and fct_yield_curve.

  - id: DFF
    title_display: Fed funds rate (effective, daily)
    freq: D
    ingest: daily
    usage: |
      The short-rate leg of the season, as a monthly mean. Replaces FEDFUNDS, which is published
      only after month-end and so cannot carry a provisional current month.
      Also drives S1 (10Y - FF < 0), S2 (FF > longer-run projection) and T2 (2Y - FF < 0).

  - id: DGS2
    title_display: 2-year Treasury yield
    freq: D
    ingest: daily
    usage: |
      Breakdown flag T2 (2Y - FF < 0): market expectations move ahead of the policy rate,
      so an inversion here prices cuts. Also a tenor on the yield curve snapshot.

  - id: DGS3MO
    title_display: 3-month Treasury yield
    freq: D
    ingest: daily
    usage: Yield curve snapshot only (shortest tenor)

  - id: DGS5
    title_display: 5-year Treasury yield
    freq: D
    ingest: daily
    usage: Yield curve snapshot only

  - id: DGS30
    title_display: 30-year Treasury yield
    freq: D
    ingest: daily
    usage: |
      Yield curve snapshot only (longest tenor). Note the 2002-2006 gap, when the 30-year was
      not issued: the snapshot takes only dates where every tenor is present.

  - id: FEDTARMDLR
    title_display: FOMC longer-run fed funds projection (median)
    freq: Q
    ingest: monthly
    usage: |
      Vulnerability flag S2 (FF above neutral). The FOMC's own estimate of neutral, so the
      threshold is not one we chose. Available from 2012; before that S2 counts as off.

# ── Equities ──────────────────────────────────────────────────────────────────
# Not on FRED, so this is a separate block with its own ingester (ingest/equities.py).
# FRED's own SP500 series only goes back 10 years, which is far too short for a panel
# that starts in 1985.
equities:
  - id: GSPC
    symbol: "^GSPC"
    source: yfinance
    title_display: S&P 500
    freq: D
    ingest: daily
    usage: |
      Month-end close (the last close in the month, not the monthly mean, unlike the rates).
      Drives the credit cycle phase with the BAA spread, and flags T4 / H3 against its
      10-month moving average.
    caveat: |
      yfinance is an unofficial API. A failed fetch must stop the CI run rather than update
      the signals from partial data. A fallback source is still an open question.

# ── Regime signals ────────────────────────────────────────────────────────────
# The monetary policy cycle (about 5 years) and the credit cycle (about 10 years) are two
# separate cycles, not one circle. Every threshold below is a natural boundary, a policy unit
# or an official estimate -- never a value fitted to history. Measurement windows were fixed
# in advance. History is used to falsify the rules, not to tune them.
regime:
  # The panel starts well before the display window so the six-month changes and the
  # 10-month moving average are warm by the time anything is shown.
  panel_start: "1985-01-01"
  display_start: "1987-01-01"

  season:
    window_months: 6   # long enough to catch a ~15-month season in its first half
    gate: 0.25         # one policy step. Below this on both ends, the previous season carries over

  phase:
    window_months: 6
    confirm_months: 2  # a single month's move does not change the phase

  stance:
    vulnerability_min: 2   # never act on a single indicator
    breakdown_min: 2
    recovery_min: 2
    # Vulnerability flags such as inversion fade once a breakdown starts, so the stance has to
    # remember them. 24 months is the commonly cited upper bound on inversion -> recession.
    memory_months: 24
    # Open question: requiring T1 (risk-off) for Cut equities was proposed to damp the 2022-25
    # whipsaw. Re-simulated, it does not -- both large 2022 episodes survive and the 2002
    # second leg turns from a -9.5% avoided decline into a +6.9% missed rally. Left off.
    require_t1: false

  seasons:
    - key: spring
      label: Spring
      curve_move: Bear steepening
      rates: rising
      curve: steepening
      description: Long rates rise and the curve steepens, as markets start to fear hikes
      asset_class: Developed-market equities
      bonds: High-yield corporates, EM bonds
      sectors: Technology
    - key: summer
      label: Summer
      curve_move: Bear flattening
      rates: rising
      curve: flattening
      description: Short rates rise and the curve flattens, as the Fed hikes
      asset_class: Emerging-market equities
      bonds: Australian-dollar bonds
      sectors: Materials
    - key: autumn
      label: Autumn
      curve_move: Bull flattening
      rates: falling
      curve: flattening
      description: Long rates fall and the curve flattens, as markets expect cuts. The curve inverts in late autumn
      asset_class: Bonds
      bonds: Developed-market foreign bonds
      sectors: Utilities, pharma
    - key: winter
      label: Winter
      curve_move: Bull steepening
      rates: falling
      curve: steepening
      description: Short rates fall and the curve steepens, as the Fed cuts
      asset_class: REITs
      bonds: Domestic bonds
      sectors: Banks, retail

  phases:
    - key: riskon
      phase_no: 1
      label: Risk-on
      equities: Stocks up
      spreads: spreads narrowing
      banks: expanding lending
      companies: profits improving, credit strong
    - key: leverage
      phase_no: 2
      label: Leverage
      equities: Stocks up
      spreads: spreads widening
      banks: turning cautious
      companies: borrowing aggressively, credit weakening
    - key: riskoff
      phase_no: 3
      label: Risk-off
      equities: Stocks down
      spreads: spreads widening
      banks: cutting lending
      companies: profits falling, credit weak
    - key: repair
      phase_no: 4
      label: Deleveraging
      equities: Stocks down
      spreads: spreads narrowing
      banks: lending attitude improving
      companies: paying down debt, credit recovering

  stances:
    - key: normal
      label: Stay the course
      description: Keep the target allocation
    - key: nochase
      label: Don't chase
      description: Hold off on adding to positions or opening new ones
    - key: reduce
      label: Cut equities
      description: Take the equity weight below target
    - key: restore
      label: Rebuild equities
      description: Bring the equity weight back to target

  flags:
    - { key: S1, stage: vulnerability, label: Inverted curve,             rule: "10Y - FF < 0",                     rationale: Natural boundary,                                                                       series: "DGS10, DFF" }
    - { key: S2, stage: vulnerability, label: Policy rate above neutral,  rule: "FF > FOMC longer-run projection",  rationale: "The FOMC's own estimate of neutral. Available from 2012; counts as off before that",   series: "DFF, FEDTARMDLR" }
    - { key: S3, stage: vulnerability, label: Banks tightening lending,   rule: "DRTSCILM > 0",                     rationale: "More banks tightening than easing. Applied from the month after publication",          series: DRTSCILM }
    - { key: S4, stage: vulnerability, label: Leverage phase,             rule: "Credit phase 2",                   rationale: Spreads widening while stocks rise marks a market near its top,                          series: "(phase)" }
    - { key: T1, stage: breakdown,     label: Risk-off phase,             rule: "Credit phase 3",                   rationale: Stocks falling and spreads widening at the same time,                                    series: "(phase)" }
    - { key: T2, stage: breakdown,     label: Markets pricing cuts,       rule: "2Y - FF < 0",                      rationale: Natural boundary. Market expectations move ahead of the policy rate,                     series: "DGS2, DFF" }
    - { key: T3, stage: breakdown,     label: Labor market weakening,     rule: "Sahm indicator >= 0.5",            rationale: "Rule of thumb. Fires 1-3 months after a recession starts, so it confirms rather than warns (false positive 2024-07)", series: SAHMREALTIME }
    - { key: T4, stage: breakdown,     label: Stocks break trend,         rule: "S&P 500 < its 10-month average",   rationale: "Trends tend to persist. Noisy alone, so it only counts alongside vulnerability",        series: "^GSPC" }
    - { key: H1, stage: recovery,      label: Deleveraging phase,         rule: "Credit phase 4",                   rationale: Spread peaks sat within +/-3 months of all 10 market troughs since 1990,                 series: "(phase)" }
    - { key: H2, stage: recovery,      label: Jobless claims turning down, rule: "3-month change in claims < 0",    rationale: A change of direction (natural boundary),                                                series: ICSA }
    - { key: H3, stage: recovery,      label: Stocks regain trend,        rule: "S&P 500 > its 10-month average",   rationale: The mirror image of a trend break,                                                       series: "^GSPC" }

  # Indicator monitor. `score_rule` picks a CASE branch in fct_indicator_monitor:
  #   le    +2 if value <= t1, else -2
  #   ge    +2 if value >= t1, else -2
  #   band  +2 if value >= t1; 0 if value >= t2; else -2
  # `flag_rule` is lt | gt against flag_threshold. `clip` caps the drawn y-axis at
  # median + 6*MAD so the 2008-09 and 2020 spikes do not flatten normal moves (display only).
  indicators:
    - { key: ff12,   monitor_group: core_five, title: "1 - Fed funds, year-over-year change",        unit: pp,  score_rule: le,   score_t1: 0.25, ref_lines: "0.25" }
    - { key: spr,    monitor_group: core_five, title: "2 - Term spread (10-year minus fed funds)",   unit: pp,  score_rule: band, score_t1: 1.0, score_t2: 0.0, ref_lines: "0|1" }
    - { key: y1012,  monitor_group: core_five, title: "3 - 10-year yield, year-over-year change",    unit: pp,  score_rule: ge,   score_t1: 0.0,  ref_lines: "0" }
    - { key: baa12,  monitor_group: core_five, title: "4 - Corporate spread, year-over-year change", unit: pp,  score_rule: le,   score_t1: 0.0,  ref_lines: "0" }
    - { key: usd12,  monitor_group: core_five, title: "5 - Dollar index, year-over-year change",     unit: pct, score_rule: le,   score_t1: 0.0,  ref_lines: "0", first_month: "2007-01-01" }
    - { key: y2ff,   monitor_group: added, title: "2-year yield minus fed funds",                 unit: pp,  flag_key: T2, flag_rule: lt, flag_threshold: 0.0, ref_lines: "0" }
    - { key: ffgap,  monitor_group: added, title: "Fed funds minus FOMC longer-run projection",   unit: pp,  flag_key: S2, flag_rule: gt, flag_threshold: 0.0, ref_lines: "0", first_month: "2012-02-01" }
    - { key: sloos,  monitor_group: added, title: "Bank lending standards (SLOOS)",               unit: pct, flag_key: S3, flag_rule: gt, flag_threshold: 0.0, ref_lines: "0", first_month: "1990-05-01" }
    - { key: sahm,   monitor_group: added, title: "Sahm indicator",                               unit: idx, flag_key: T3, flag_rule: ge, flag_threshold: 0.5, ref_lines: "0.5", clip: true }
    - { key: claims, monitor_group: added, title: "Initial jobless claims (thousands, monthly average)", unit: k, flag_key: H2, flag_rule: none, ref_lines: "", clip: true }
    - { key: spxgap, monitor_group: added, title: "S&P 500 vs its 10-month average",              unit: pct, flag_key: T4, flag_rule: lt, flag_threshold: 0.0, ref_lines: "0" }
    - { key: baa,    monitor_group: added, title: "Corporate spread level (BAA minus 10-year)",   unit: pp,  flag_rule: none, ref_lines: "" }

# ── Results of the existence check ────────────────────────────────────────────
# Carried out 2026-08-18. https://fred.stlouisfed.org/graph/fredgraph.csv?id=<ID> (no API key needed)
# All 28 exist. Below are the measured ranges. Series that bind how far back the panel can go are marked with a star.
verification:
  checked_at: "2026-08-18"
  method: "Fetched the full history via fredgraph.csv (no API key needed) and measured the first and last observation dates"
  ranges:
    AHETPI:       ["1964-01-01", "2026-07-01"]
    AWHMAN:       ["1939-01-01", "2026-07-01"]
    BAA10Y:       ["1986-01-02", "2026-08-14"]
    CPILFESL:     ["1957-01-01", "2026-07-01"]
    DCOILWTICO:   ["1986-01-02", "2026-08-11"]
    DEXJPUS:      ["1971-01-04", "2026-08-14"]
    BOGMBASE:     ["1959-01-01", "2026-06-01"]
    DFII10:       ["2003-01-02", "2026-08-14"]   # * binds pillars 2/3
    DGS10:        ["1962-01-02", "2026-08-14"]
    DRTSCILM:     ["1990-04-01", "2026-07-01"]
    DTWEXBGS:     ["2006-01-02", "2026-08-14"]   # * binds pillar 5
    FEDFUNDS:     ["1954-07-01", "2026-07-01"]
    ICSA:         ["1967-01-07", "2026-08-08"]
    INDPRO:       ["1919-01-01", "2026-07-01"]
    NEWORDER:     ["1992-02-01", "2026-06-01"]
    NFCI:         ["1971-01-08", "2026-08-07"]
    PAYEMS:       ["1939-01-01", "2026-07-01"]
    PCEPILFE:     ["1959-01-01", "2026-06-01"]
    PERMIT:       ["1960-01-01", "2026-07-01"]
    RRPONTSYD:    ["2003-02-07", "2026-08-17"]
    SAHMREALTIME: ["1959-12-01", "2026-07-01"]
    T10Y3M:       ["1982-01-04", "2026-08-17"]
    T10YFF:       ["1962-01-02", "2026-08-14"]
    T10YIE:       ["2003-01-02", "2026-08-17"]   # * binds pillar 2
    T5YIFR:       ["2003-01-02", "2026-08-17"]   # * binds pillar 2
    UMCSENT:      ["1952-11-01", "2026-06-01"]
    USREC:        ["1854-12-01", "2026-07-01"]
    VIXCLS:       ["1990-01-02", "2026-08-17"]
    WALCL:        ["2002-12-18", "2026-08-12"]
    WMTSECL1:     ["2002-12-18", "2026-08-12"]
    WTREGEN:      ["2002-12-18", "2026-08-12"]

  # Series that were not adopted, and why (recorded so the same research is not repeated on review)
  rejected:
