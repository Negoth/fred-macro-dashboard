name: "tableau_terminal"
version: "0.1.0"
config-version: 2
profile: "tableau_terminal"

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Globs for the raw layer. Two levels: <key>=<ID>/ingested_at=<DATE>/
  raw_observations: "data/raw/fred/*/*/response.json.gz"
  raw_series_meta: "data/raw/fred/*/*/series_meta.json.gz"
  raw_yf_observations: "data/raw/yfinance/*/*/response.json.gz"

  # Must be kept in sync with meta.history_start in config/series.yaml.
  # Display filter only -- it never limits what is ingested or computed
  history_start: "2003-01-01"

  # Must be kept in sync with the `regime:` block of config/series.yaml.
  # The panel starts well before the display window so the six-month changes and the
  # 10-month moving average are warm by the time anything is shown
  regime_panel_start: "1985-01-01"
  regime_display_start: "1987-01-01"
  # A window frame bound must be a literal in SQL, so these cannot come from a seed the way
  # the labels do -- they have to be vars, and nothing enforces the match with series.yaml
  regime_season_window: 6           # months, fixed in advance (see design note 6.4)
  regime_phase_window: 6
  # 'mean_7day'      ff is the mean of DFF over all calendar days  (reproduces FEDFUNDS)
  # 'business_day'   ff is restricted to DGS10's calendar          (reproduces T10YFF exactly)
  # Only affects the spread and S1, never the season axes. See issue #8
  regime_spread_source: mean_7day
  regime_season_gate: 0.25          # one policy step
  regime_phase_confirm: 2           # months of agreement before the phase switches
  regime_vulnerability_min: 2
  regime_breakdown_min: 2
  regime_recovery_min: 2
  regime_memory_months: 24
  regime_require_t1: false          # see issue #9: it does not damp the 2022-25 whipsaw

models:
  tableau_terminal:
    staging:
      +materialized: view
    intermediate:
      # Materialised as tables. As views, every mart and its tests re-ran the whole
      # computation from the raw JSON, which cost 6x the CPU time
      +materialized: table
    marts:
      +materialized: table
