version: 2

models:
  - name: stg_fred_observations
    description: FRED observations unpacked into a typed long format. Deduplicated for strategy A
    columns:
      - name: series_id
        tests: [not_null]
      - name: observation_date
        tests: [not_null]

  - name: dim_series
    description: The series dimension. A join of config/series.yaml (the seed) and the FRED metadata
    columns:
      - name: series_id
        tests: [not_null, unique]
      - name: pillar
        tests:
          - accepted_values:
              arguments:
                values: ["growth", "inflation", "financial", "credit", "dollar"]
              config:
                # The context series and derived-series components have no pillar
                where: "pillar is not null and pillar <> ''"
      - name: role
        tests:
          - accepted_values:
              arguments:
                values: ["series", "derived", "component", "context"]

  - name: fct_observations
    description: The observation fact table at its native grain. Read by Tableau
    columns:
      - name: series_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_id
      - name: observation_date
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: fct_regime
    description: Season, credit phase, the eleven flags and the stance. One row per month
    columns:
      - name: month
        tests: [not_null, unique]
      - name: season
        tests:
          - accepted_values:
              arguments:
                values: ["spring", "summer", "autumn", "winter"]
              config:
                # Null until the first reading clears the 25bp gate
                where: "season is not null"
          - relationships:
              arguments:
                to: ref('regime_seasons')
                field: key
              config:
                where: "season is not null"
      - name: phase
        tests:
          - accepted_values:
              arguments:
                values: ["riskon", "leverage", "riskoff", "repair"]
              config:
                where: "phase is not null"
          - relationships:
              arguments:
                to: ref('regime_phases')
                field: key
              config:
                where: "phase is not null"
      - name: stance
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["normal", "nochase", "reduce", "restore"]
          - relationships:
              arguments:
                to: ref('regime_stances')
                field: key
      - name: n_s
        tests: [not_null]
      - name: n_t
        tests: [not_null]
      - name: n_h
        tests: [not_null]

  - name: fct_yield_curve
    description: Yield curve snapshots at now, six months ago and twelve months ago
    columns:
      - name: snapshot
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["now", "m6", "m12"]
      - name: snapshot_date
        tests: [not_null]
      - name: tenor_years
        tests: [not_null]
      - name: yield
        tests: [not_null]

seeds:
  - name: series_config
    columns:
      - name: series_id
        tests: [not_null, unique]

  # Regime reference data, generated from the `regime:` block of config/series.yaml.
  # Uniqueness matters: fct_regime joins to these on `key`, so a duplicate would fan out.
  - name: regime_seasons
    description: Season labels, what the curve is doing, and what tends to do well in each
    columns:
      - name: key
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["spring", "summer", "autumn", "winter"]

  - name: regime_phases
    description: Credit cycle phase labels and how banks and companies behave in each
    columns:
      - name: key
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["riskon", "leverage", "riskoff", "repair"]

  - name: regime_stances
    description: The four portfolio stances and what each means
    columns:
      - name: key
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["normal", "nochase", "reduce", "restore"]

  - name: regime_flags
    description: The 11 signal flags, their rules and why each threshold sits where it does
    columns:
      - name: key
        tests: [not_null, unique]
      - name: stage
        tests:
          - accepted_values:
              arguments:
                values: ["vulnerability", "breakdown", "recovery"]

  - name: regime_indicators
    description: "Indicator monitor definitions: thresholds, the +/-2 rules and the flag each maps to"
    columns:
      - name: key
        tests: [not_null, unique]
      - name: monitor_group
        tests:
          - accepted_values:
              arguments:
                values: ["core_five", "added"]
      - name: score_rule
        tests:
          - accepted_values:
              arguments:
                values: ["le", "ge", "band"]
              config:
                where: "score_rule is not null"
